# ==============================================================================
# Helmfile: helmfiles/portainer.yaml
# Description: Declarative Helmfile specification for deploying Portainer CE
#              on K3s/Kubernetes cluster configured with Traefik Ingress by default.
# Usage: helmfile -f helmfiles/portainer.yaml sync
# ==============================================================================

repositories:
  - name: portainer
    url: https://portainer.github.io/k8s/

releases:
  - name: portainer
    namespace: portainer
    createNamespace: true
    chart: portainer/portainer
    values:
      - service:
          type: {{ env "PORTAINER_SERVICE_TYPE" | default "ClusterIP" | quote }}
          httpNodePort: {{ env "PORTAINER_HTTP_NODEPORT" | default "30777" }}
          httpsNodePort: {{ env "PORTAINER_HTTPS_NODEPORT" | default "30779" }}
        persistence:
          enabled: true
          {{- if env "PORTAINER_STORAGE_CLASS" }}
          storageClass: {{ env "PORTAINER_STORAGE_CLASS" | quote }}
          {{- end }}
        ingress:
          enabled: {{ env "PORTAINER_INGRESS_ENABLED" | default "true" }}
          ingressClassName: {{ env "PORTAINER_INGRESS_CLASS" | default "traefik" | quote }}
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          hosts:
            - host: {{ env "PORTAINER_INGRESS_HOST" | default "portainer.local" | quote }}
              paths:
                - path: /
                  pathType: Prefix
