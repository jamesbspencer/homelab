services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
     - 80:80
     - 443:443
    networks:
      - net1
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ./traefik/acme.json:/etc/traefik/acme.json
      - ./traefik/certs:/etc/traefik/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
     - 11434:11434
    networks:
      - ai
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: pgvector/pgvector:${POSTGRES_VERSION}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    restart: unless-stopped
    networks:
      - net1
      - ai
      - db
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - VECTOR_DB=pgvector
      - VECTOR_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_TRUST_ENV=True
      - AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER=False
      - GLOBAL_LOG_LEVEL=INFO
      - RAG_WEB_LOADER_ENGINE=playwright
      - PLAYWRIGHT_WS_URI=ws://browserless:3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`ai.spencer.lan`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    depends_on:
      - ollama
      - db
      - browserless
  
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:${TERMINAL_DOCKER_TAG-main}
    container_name: open-terminal
    restart: unless-stopped
    networks:
      - ai
    volumes:
      - ./open-terminal:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: valkey
    restart: unless-stopped
    volumes:
      - ./valkey/data:/data
    command: >
      valkey-server
      --save 30 1
      --loglevel warning
    networks:
      - redis
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/config/:/etc/searxng/
      - ./searxng/data/:/var/cache/searxng/
    networks:
      - redis
      - ai
    depends_on:
      - valkey

  browserless:
    image: browserless/chrome:latest
    container_name: browserless
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=10
    networks:
      - ai

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "9119:9119"
    volumes:
      - ./hermes:/opt/data

    networks:
      - net1
      - ai
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
      - API_SERVER_ENABLED=${API_SERVER_ENABLED}
      - API_SERVER_KEY=${HERMES_API_KEY}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - HERMES_MODEL=${HERMES_MODEL}
      - HERMES_PROVIDER=${HERMES_PROVIDER}
      - HERMES_MODEL_PROVIDER=${HERMES_PROVIDER}
      - HERMES_BASE_URL=${CUSTOM_BASE_URL}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      - PUID=${PUID}
      - PGID=${PGID}
      - BROWSER_CDP_URL=${BROWSER_CDP_URL}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS}
      - SEARXNG_URL=${SEARXNG_URL}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://firecrawl:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    depends_on:
      - firecrawl
    labels:
      - "traefik.enable=true"
      # Gateway routing (port 8642)
      - "traefik.http.routers.hermes-gateway.rule=Host(`hermes.spencer.lan`)"
      - "traefik.http.routers.hermes-gateway.entrypoints=websecure"
      - "traefik.http.routers.hermes-gateway.tls=true"
      - "traefik.http.routers.hermes-gateway.service=hermes-gateway-svc"
      - "traefik.http.services.hermes-gateway-svc.loadbalancer.server.port=8642"
      # Dashboard routing (port 9119)
      - "traefik.http.routers.hermes-dashboard.rule=Host(`hermes-dashboard.spencer.lan`)"
      - "traefik.http.routers.hermes-dashboard.entrypoints=websecure"
      - "traefik.http.routers.hermes-dashboard.tls=true"
      - "traefik.http.routers.hermes-dashboard.service=hermes-dashboard-svc"
      - "traefik.http.services.hermes-dashboard-svc.loadbalancer.server.port=9119"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    networks:
      - ai
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB}
    volumes:
      - ./nuq-postgres:/var/lib/postgresql/data
    networks:
      - ai

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: playwright-service
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - ai

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    networks:
      - ai
      - redis
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
      REDIS_URL: redis://valkey:6379
      REDIS_RATE_LIMIT_URL: redis://valkey:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB}
      SEARXNG_ENDPOINT: http://searxng:8080
      USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      HARNESS_STARTUP_TIMEOUT_MS: 60000
    depends_on:
      valkey:
        condition: service_started
      searxng:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

networks:
  net1:
    name: net1
    driver: bridge
  ai:
    name: ai
  db:
    name: db
  redis:
    name: redis

