services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
     - 80:80
     - 443:443
    networks:
      - net1
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ./traefik/acme.json:/etc/traefik/acme.json
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/logs:/var/log/traefik
      - ./traefik/crowdsec_bouncer_key:/etc/traefik/crowdsec_bouncer_key:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:-}
    depends_on:
      - crowdsec

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
      BOUNCER_KEY_TRAEFIK: "${CROWDSEC_BOUNCER_KEY}"
      CUSTOM_HOSTNAME: "homelab-crowdsec"
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./traefik/logs:/var/log/traefik:ro
    networks:
      - net1


  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
     - 11434:11434
    networks:
      - ai
    volumes:
      - ./ollama:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  momoe:
    build:
      context: ./momoe/src
      args:
        CUDA_ARCHITECTURES: "86"
        BUILD_VISION: "0"
    image: homelab/momoe:latest
    container_name: momoe
    restart: unless-stopped
    networks:
      - ai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./momoe/data:/data
      - ./momoe/docker-entrypoint.sh:/opt/strata/docker-entrypoint.sh:ro
    environment:
      - FAMILY=${MOMOE_FAMILY:-ornith}
      - MODEL=${MOMOE_MODEL:-IQ4_XS}
      - CONTEXT=${MOMOE_CONTEXT:-65536}
      - KV_STREAMING=${MOMOE_KV_STREAMING:-on}
      - VISION=${MOMOE_VISION:-no}
      - HOST=0.0.0.0
      - PORT=8080
      - API_KEY=${MOMOE_API_KEY:-momoe-local}
      - STRATA_ALLOWED_HOSTS=momoe,localhost,127.0.0.1
      - GPU=0
      - VRAM_RESERVE_MIB=${MOMOE_VRAM_RESERVE_MIB:-2560}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  pgvector:
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    container_name: pgvector
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        usermod -u $${PUID:-1000} postgres 2>/dev/null || true
        groupmod -g $${PGID:-1000} postgres 2>/dev/null || true
        exec /usr/local/bin/docker-entrypoint.sh postgres
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      POSTGRES_USER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DB:-postgres}
      AUTHENTIK_POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      OPENWEBUI_POSTGRES_DB: ${OPENWEBUI_POSTGRES_DB:-openwebui}
      OPENWEBUI_POSTGRES_USER: ${OPENWEBUI_POSTGRES_USER:-openwebui}
      OPENWEBUI_POSTGRES_PASSWORD: ${OPENWEBUI_POSTGRES_PASSWORD}
      OPENWEBUI_KNOWLEDGE_POSTGRES_DB: ${OPENWEBUI_KNOWLEDGE_POSTGRES_DB:-openwebui_knowledge}
    volumes:
      - ./pgvector/data:/var/lib/postgresql/data
      - ./pgvector/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: valkey
    restart: unless-stopped
    volumes:
      - ./valkey/data:/data
    command: >
      valkey-server
      --save 30 1
      --loglevel warning
    networks:
      - redis
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/config/:/etc/searxng/
      - ./searxng/data/:/var/cache/searxng/
    networks:
      - redis
      - ai
    depends_on:
      valkey:
        condition: service_started

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.1}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_REDIS__PORT: 6379
      AUTHENTIK_POSTGRESQL__HOST: pgvector
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - ./authentik/media:/media
      - ./authentik/custom-templates:/templates
    networks:
      - net1
      - db
      - redis
    depends_on:
      pgvector:
        condition: service_healthy
      valkey:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Local LAN SSO routing
      - "traefik.http.routers.authentik.rule=Host(`sso.spencer.lan`) || Host(`login.spencer.lan`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.routers.authentik.service=authentik"
      # Public SSO routing (Let's Encrypt)
      - "traefik.http.routers.authentik-public.rule=Host(`${SSO_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.authentik-public.entrypoints=websecure"
      - "traefik.http.routers.authentik-public.tls=true"
      - "traefik.http.routers.authentik-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.authentik-public.service=authentik"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.1}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_REDIS__PORT: 6379
      AUTHENTIK_POSTGRESQL__HOST: pgvector
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - ./authentik/media:/media
      - ./authentik/custom-templates:/templates
    networks:
      - db
      - redis
      - net1
    depends_on:
      pgvector:
        condition: service_healthy
      valkey:
        condition: service_healthy

  dozzle:
    image: amir20/dozzle:${DOZZLE_VERSION:-latest}
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - net1
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_LEVEL=info
      - DOZZLE_AUTH_PROVIDER=forward-proxy
      - DOZZLE_AUTH_HEADER_USER=X-authentik-username
      - DOZZLE_AUTH_HEADER_EMAIL=X-authentik-email
      - DOZZLE_AUTH_HEADER_NAME=X-authentik-name
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.spencer.lan`) || Host(`dozzle.spencer.lan`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.middlewares=authentik@file"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  ntfy:
    image: binwiederhier/ntfy:${NTFY_VERSION:-latest}
    container_name: ntfy
    restart: unless-stopped
    command: serve
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - net1
      - ai
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./ntfy/data:/var/lib/ntfy
      - ./ntfy/cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=https://${NTFY_PUBLIC_DOMAIN:-push.spencer.lan}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Internal LAN Router - API & Mobile app bypass (Priority 100)
      - "traefik.http.routers.ntfy-api.rule=(Host(`push.spencer.lan`) || Host(`ntfy.spencer.lan`)) && (Method(`POST`) || Method(`PUT`) || HeaderRegexp(`Authorization`, `.+`))"
      - "traefik.http.routers.ntfy-api.entrypoints=websecure"
      - "traefik.http.routers.ntfy-api.tls=true"
      - "traefik.http.routers.ntfy-api.priority=100"
      - "traefik.http.routers.ntfy-api.service=ntfy-svc"
      # Internal LAN Router - Web UI with Authentik ForwardAuth SSO (Priority 50)
      - "traefik.http.routers.ntfy-web.rule=Host(`push.spencer.lan`) || Host(`ntfy.spencer.lan`)"
      - "traefik.http.routers.ntfy-web.entrypoints=websecure"
      - "traefik.http.routers.ntfy-web.tls=true"
      - "traefik.http.routers.ntfy-web.priority=50"
      - "traefik.http.routers.ntfy-web.middlewares=authentik@file"
      - "traefik.http.routers.ntfy-web.service=ntfy-svc"
      # Public WAN Router - API & Mobile app bypass (Priority 100)
      - "traefik.http.routers.ntfy-public-api.rule=Host(`${NTFY_PUBLIC_DOMAIN}`) && (Method(`POST`) || Method(`PUT`) || HeaderRegexp(`Authorization`, `.+`))"
      - "traefik.http.routers.ntfy-public-api.entrypoints=websecure"
      - "traefik.http.routers.ntfy-public-api.tls=true"
      - "traefik.http.routers.ntfy-public-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ntfy-public-api.priority=100"
      - "traefik.http.routers.ntfy-public-api.service=ntfy-svc"
      # Public WAN Router - Web UI with Authentik ForwardAuth SSO (Priority 50)
      - "traefik.http.routers.ntfy-public-web.rule=Host(`${NTFY_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.ntfy-public-web.entrypoints=websecure"
      - "traefik.http.routers.ntfy-public-web.tls=true"
      - "traefik.http.routers.ntfy-public-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ntfy-public-web.priority=50"
      - "traefik.http.routers.ntfy-public-web.middlewares=authentik@file"
      - "traefik.http.routers.ntfy-public-web.service=ntfy-svc"
      # Load balancer service
      - "traefik.http.services.ntfy-svc.loadbalancer.server.port=80"

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - net1
      - ai
      - redis
    volumes:
      - ./omniroute/data:/app/data
    environment:
      - PORT=20128
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET}
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD}
      - REDIS_URL=redis://valkey:6379
      - OMNIROUTE_MEMORY_MB=1024
      - REQUIRE_API_KEY=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MOMOE_API_KEY=${MOMOE_API_KEY:-momoe-local}
    depends_on:
      valkey:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    labels:
      - "traefik.enable=true"
      # Internal LAN Router - Web UI Dashboard (Priority 50)
      - "traefik.http.routers.omniroute-web.rule=Host(`llm.spencer.lan`)"
      - "traefik.http.routers.omniroute-web.entrypoints=websecure"
      - "traefik.http.routers.omniroute-web.tls=true"
      - "traefik.http.routers.omniroute-web.priority=50"
      - "traefik.http.routers.omniroute-web.service=omniroute-svc"
      # Internal LAN Router - API & Models bypass ForwardAuth via Bearer auth (Priority 100)
      - "traefik.http.routers.omniroute-api.rule=Host(`llm.spencer.lan`) && (PathPrefix(`/v1`) || PathPrefix(`/healthz`))"
      - "traefik.http.routers.omniroute-api.entrypoints=websecure"
      - "traefik.http.routers.omniroute-api.tls=true"
      - "traefik.http.routers.omniroute-api.priority=100"
      - "traefik.http.routers.omniroute-api.service=omniroute-svc"
      # Load balancer service
      - "traefik.http.services.omniroute-svc.loadbalancer.server.port=20128"

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_VERSION:-main}
    container_name: open-webui
    restart: unless-stopped
    networks:
      - net1
      - ai
      - db
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      # Application Core
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}
      - WEBUI_NAME=Homelab AI
      - GLOBAL_LOG_LEVEL=INFO

      # Database & Persistence (pgvector for Core State + Dedicated External Knowledge Vector Store)
      - DATABASE_URL=postgresql://${OPENWEBUI_POSTGRES_USER:-openwebui}:${OPENWEBUI_POSTGRES_PASSWORD}@pgvector:5432/${OPENWEBUI_POSTGRES_DB:-openwebui}
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${OPENWEBUI_POSTGRES_USER:-openwebui}:${OPENWEBUI_POSTGRES_PASSWORD}@pgvector:5432/${OPENWEBUI_KNOWLEDGE_POSTGRES_DB:-openwebui_knowledge}

      # Model Providers: Dual OmniRoute + Ollama
      - OPENAI_API_BASE_URL=http://omniroute:20128/v1
      - OPENAI_API_KEY=${OMNIROUTE_MASTER_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434

      # Offload RAG & Memory Embeddings to OmniRoute (Zero In-Container Model RAM)
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://omniroute:20128/v1
      - RAG_OPENAI_API_KEY=${OMNIROUTE_MASTER_KEY}
      - RAG_EMBEDDING_MODEL=nomic-embed-text

      # Conversational Memory
      - ENABLE_MEMORIES=True

      # Search Engine & Web Loader Grounding (Firecrawl & SearXNG)
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=firecrawl
      - RAG_WEB_LOADER_ENGINE=firecrawl
      - FIRECRAWL_API_BASE_URL=http://firecrawl:3002
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-homelab-local}
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_TRUST_ENV=True
      - AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER=False

      # Security & Signup
      - WEBUI_AUTH=True
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-False}
      - ENABLE_VALVE_ENCRYPTION=${ENABLE_VALVE_ENCRYPTION:-True}
      - ENABLE_TOOL_SERVERS=True
      - TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal","name":"Open Terminal","enabled":true,"url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY}","auth_type":"bearer","config":{"access_grants":[]}}]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      pgvector:
        condition: service_healthy
      omniroute:
        condition: service_healthy
      ollama:
        condition: service_started
      firecrawl:
        condition: service_started
      open-terminal:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      # Local LAN Routing
      - "traefik.http.routers.open-webui.rule=Host(`chat.spencer.lan`) || Host(`ai.spencer.lan`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls=true"
      - "traefik.http.routers.open-webui.service=open-webui-svc"
      - "traefik.http.services.open-webui-svc.loadbalancer.server.port=8080"
      # Public WAN Routing
      - "traefik.http.routers.open-webui-public.rule=Host(`${OPENWEBUI_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.open-webui-public.entrypoints=websecure"
      - "traefik.http.routers.open-webui-public.tls=true"
      - "traefik.http.routers.open-webui-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.open-webui-public.service=open-webui-svc"

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:${OPEN_TERMINAL_VERSION:-latest}
    container_name: open-terminal
    restart: unless-stopped
    networks:
      - ai
    volumes:
      - ./open-terminal/workspace:/home/user
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - OPEN_TERMINAL_MAX_SESSIONS=${OPEN_TERMINAL_MAX_SESSIONS:-16}
      - OPEN_TERMINAL_ENABLE_TERMINAL=true
      - OPEN_TERMINAL_ENABLE_NOTEBOOKS=true
      - OPEN_TERMINAL_FILE_BROWSER_ROOT=home
      - OPEN_TERMINAL_PACKAGES=${OPEN_TERMINAL_PACKAGES:-curl git jq tree}
      - OPEN_TERMINAL_PIP_PACKAGES=${OPEN_TERMINAL_PIP_PACKAGES:-httpx requests pydantic}
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    networks:
      - ai
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB}
    volumes:
      - ./nuq-postgres:/var/lib/postgresql/data
    networks:
      - ai

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: playwright-service
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - ai

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    networks:
      - ai
      - redis
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
      REDIS_URL: redis://valkey:6379
      REDIS_RATE_LIMIT_URL: redis://valkey:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB}
      SEARXNG_ENDPOINT: http://searxng:8080
      USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      HARNESS_STARTUP_TIMEOUT_MS: 60000
    depends_on:
      valkey:
        condition: service_started
      searxng:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  gitea:
    image: gitea/gitea:${GITEA_VERSION:-latest}
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=pgvector:5432
      - GITEA__database__NAME=${GITEA_POSTGRES_DB:-gitea}
      - GITEA__database__USER=${GITEA_POSTGRES_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_POSTGRES_PASSWORD}
      - GITEA__database__SSL_MODE=disable
      - GITEA__server__DOMAIN=${GITEA_PUBLIC_DOMAIN:-git.spencer.lan}
      - GITEA__server__ROOT_URL=https://${GITEA_PUBLIC_DOMAIN:-git.spencer.lan}/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_DOMAIN=${GITEA_PUBLIC_DOMAIN:-git.spencer.lan}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__cache__ADAPTER=redis
      - GITEA__cache__HOST=redis://valkey:6379/1?idle_timeout=180
      - GITEA__session__PROVIDER=redis
      - GITEA__session__PROVIDER_CONFIG=redis://valkey:6379/2?idle_timeout=180
      - GITEA__queue__TYPE=redis
      - GITEA__queue__CONN_STR=redis://valkey:6379/3
    networks:
      - net1
      - db
      - redis
      - ai
    ports:
      - "2222:22"
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      pgvector:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Local LAN Router
      - "traefik.http.routers.gitea.rule=Host(`git.spencer.lan`) || Host(`gitea.spencer.lan`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.routers.gitea.service=gitea-svc"
      # Public WAN Router (Let's Encrypt)
      - "traefik.http.routers.gitea-public.rule=Host(`${GITEA_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.gitea-public.entrypoints=websecure"
      - "traefik.http.routers.gitea-public.tls=true"
      - "traefik.http.routers.gitea-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gitea-public.service=gitea-svc"
      # Load balancer service
      - "traefik.http.services.gitea-svc.loadbalancer.server.port=3000"

  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION:-latest}
    container_name: homepage
    restart: unless-stopped
    networks:
      - net1
      - ai
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-983}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${DOCKER_GID:-983}
      - HOMEPAGE_ALLOWED_HOSTS=home.spencer.lan,homepage.spencer.lan,homepage,homepage:3000,localhost,localhost:3000,${HOMEPAGE_PUBLIC_DOMAIN:-home.spencer.lan}
      - HOMEPAGE_VAR_AUTHENTIK_TOKEN=${HOMEPAGE_VAR_AUTHENTIK_TOKEN:-}
      - HOMEPAGE_VAR_GITEA_TOKEN=${HOMEPAGE_VAR_GITEA_TOKEN:-}
    labels:
      - "traefik.enable=true"
      # Local LAN Router (with Authentik ForwardAuth SSO)
      - "traefik.http.routers.homepage.rule=Host(`home.spencer.lan`) || Host(`homepage.spencer.lan`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.middlewares=authentik@file"
      - "traefik.http.routers.homepage.service=homepage-svc"
      # Public WAN Router (Let's Encrypt)
      - "traefik.http.routers.homepage-public.rule=Host(`${HOMEPAGE_PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.homepage-public.entrypoints=websecure"
      - "traefik.http.routers.homepage-public.tls=true"
      - "traefik.http.routers.homepage-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.homepage-public.middlewares=authentik@file"
      - "traefik.http.routers.homepage-public.service=homepage-svc"
      # Load balancer service
      - "traefik.http.services.homepage-svc.loadbalancer.server.port=3000"

  openbao:
    image: openbao/openbao:${OPENBAO_VERSION:-latest}
    container_name: openbao
    restart: unless-stopped
    user: root
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
      - BAO_API_ADDR=https://vault.spencer.lan
    volumes:
      - ./openbao/config:/openbao/config
      - ./openbao/data:/openbao/file
    networks:
      - net1
      - ai
    command: ["server"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8200/v1/sys/health?uninitcode=200\\&sealedcode=200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Local LAN Router (Internal only: vault.spencer.lan / openbao.spencer.lan)
      - "traefik.http.routers.openbao.rule=Host(`vault.spencer.lan`) || Host(`openbao.spencer.lan`)"
      - "traefik.http.routers.openbao.entrypoints=websecure"
      - "traefik.http.routers.openbao.tls=true"
      - "traefik.http.routers.openbao.service=openbao-svc"
      # Load balancer service
      - "traefik.http.services.openbao-svc.loadbalancer.server.port=8200"

  openbao-unseal:
    image: alpine:latest
    container_name: openbao-unseal
    restart: unless-stopped
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      - net1
    volumes:
      - ./openbao/unseal.sh:/unseal.sh:ro
      - ./.env.passwords:/unseal/.env.passwords:ro
      - ./openbao:/openbao:ro
    environment:
      - BAO_ADDR=http://openbao:8200
      - KEYS_FILE=/openbao/unseal.keys
      - PASSWORDS_FILE=/unseal/.env.passwords
      - INTERVAL=10
    entrypoint: ["/bin/sh", "/unseal.sh"]

networks:
  net1:
    name: net1
    driver: bridge
  ai:
    name: ai
  db:
    name: db
  redis:
    name: redis

