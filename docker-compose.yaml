services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
     - 80:80
     - 443:443
    networks:
      - net1
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml
      - ./traefik/acme.json:/etc/traefik/acme.json
      - ./traefik/certs:/etc/traefik/certs:ro
      - ./traefik/logs:/var/log/traefik
      - ./traefik/crowdsec_bouncer_key:/etc/traefik/crowdsec_bouncer_key:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:-}
    depends_on:
      - crowdsec

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
      BOUNCER_KEY_TRAEFIK: "${CROWDSEC_BOUNCER_KEY}"
      CUSTOM_HOSTNAME: "homelab-crowdsec"
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./traefik/logs:/var/log/traefik:ro
    networks:
      - net1


  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
     - 11434:11434
    networks:
      - ai
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  pgvector:
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    container_name: pgvector
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        usermod -u $${PUID:-1000} postgres 2>/dev/null || true
        groupmod -g $${PGID:-1000} postgres 2>/dev/null || true
        exec /usr/local/bin/docker-entrypoint.sh postgres
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      POSTGRES_USER: ${PGVECTOR_USER:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DB:-postgres}
      HINDSIGHT_POSTGRES_DB: ${HINDSIGHT_POSTGRES_DB:-hindsight}
      HINDSIGHT_POSTGRES_USER: ${HINDSIGHT_POSTGRES_USER:-hindsight}
      HINDSIGHT_POSTGRES_PASSWORD: ${HINDSIGHT_POSTGRES_PASSWORD}
    volumes:
      - ./pgvector/data:/var/lib/postgresql/data
      - ./pgvector/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: valkey
    restart: unless-stopped
    volumes:
      - ./valkey/data:/data
    command: >
      valkey-server
      --save 30 1
      --loglevel warning
    networks:
      - redis
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng/config/:/etc/searxng/
      - ./searxng/data/:/var/cache/searxng/
    networks:
      - redis
      - ai
    depends_on:
      - valkey
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:${HINDSIGHT_VERSION:-latest}
    container_name: hindsight
    restart: unless-stopped
    networks:
      - ai
      - db
      - net1
    environment:
      - HINDSIGHT_API_DATABASE_URL=postgresql://${HINDSIGHT_POSTGRES_USER:-hindsight}:${HINDSIGHT_POSTGRES_PASSWORD}@pgvector:5432/${HINDSIGHT_POSTGRES_DB:-hindsight}
      - HINDSIGHT_API_VECTOR_EXTENSION=pgvector
      - HINDSIGHT_API_WORKER_ID=hindsight-worker
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER:-ollama}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL:-http://ollama:11434/v1}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-qwen2.5:14b}
      - HINDSIGHT_API_LLM_MAX_CONCURRENT=${HINDSIGHT_LLM_MAX_CONCURRENT:-1}
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=local
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hindsight.rule=Host(`hindsight.spencer.lan`)"
      - "traefik.http.routers.hindsight.entrypoints=websecure"
      - "traefik.http.routers.hindsight.tls=true"
      - "traefik.http.services.hindsight.loadbalancer.server.port=9999"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    networks:
      - ai
      - db
      - net1
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    environment:
      - PORT=4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://${LITELLM_POSTGRES_USER:-litellm}:${LITELLM_POSTGRES_PASSWORD}@pgvector:5432/${LITELLM_POSTGRES_DB:-litellm}
      - STORE_MODEL_IN_DB=False
      - FORWARDED_ALLOW_IPS=*
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`llm.spencer.lan`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "9119:9119"
    volumes:
      - ./hermes:/opt/data
      - ./hermes/init/03-mcp-server.sh:/etc/cont-init.d/03-mcp-server:ro
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - net1
      - ai
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
      - API_SERVER_ENABLED=${API_SERVER_ENABLED}
      - API_SERVER_KEY=${HERMES_API_KEY}
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - HERMES_MCP_KEY=${HERMES_MCP_KEY:-${HERMES_API_KEY}}
      - MCP_PORT=8765
      - MCP_HOST=0.0.0.0
      - HERMES_MODEL=${HERMES_MODEL:-qwen2.5:14b}
      - HERMES_PROVIDER=${HERMES_PROVIDER:-custom}
      - HERMES_MODEL_PROVIDER=${HERMES_PROVIDER:-custom}
      - HERMES_BASE_URL=${CUSTOM_BASE_URL:-http://litellm:4000/v1}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL:-http://litellm:4000/v1}
      - CUSTOM_API_KEY=${LITELLM_MASTER_KEY}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}
      - PUID=${PUID}
      - PGID=${PGID}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS}
      - SEARXNG_URL=${SEARXNG_URL}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://firecrawl:3002}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - HINDSIGHT_MODE=${HINDSIGHT_MODE:-local_external}
      - HINDSIGHT_API_URL=${HINDSIGHT_API_URL:-http://hindsight:8888}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-hermes}
      - TERMINAL_ENV=${HERMES_TERMINAL_ENV:-docker}
      - TERMINAL_DOCKER_IMAGE=${HERMES_TERMINAL_DOCKER_IMAGE:-nikolaik/python-nodejs:python3.11-nodejs20}
      - TERMINAL_CONTAINER_PERSISTENT=false
    depends_on:
      - firecrawl
      - hindsight
      - litellm
    labels:
      - "traefik.enable=true"
      # Gateway routing (port 8642)
      - "traefik.http.routers.hermes-gateway.rule=Host(`hermes-api.spencer.lan`)"
      - "traefik.http.routers.hermes-gateway.entrypoints=websecure"
      - "traefik.http.routers.hermes-gateway.tls=true"
      - "traefik.http.routers.hermes-gateway.service=hermes-gateway-svc"
      - "traefik.http.services.hermes-gateway-svc.loadbalancer.server.port=8642"
      # Dashboard routing (port 9119)
      - "traefik.http.routers.hermes-dashboard.rule=Host(`hermes.spencer.lan`) || Host(`ai.spencer.lan`) || Host(`hermes-desktop.spencer.lan`) || Host(`hermes-dashboard.spencer.lan`)"
      - "traefik.http.routers.hermes-dashboard.entrypoints=websecure"
      - "traefik.http.routers.hermes-dashboard.tls=true"
      - "traefik.http.routers.hermes-dashboard.service=hermes-dashboard-svc"
      - "traefik.http.services.hermes-dashboard-svc.loadbalancer.server.port=9119"
      # Public Dashboard routing (port 9119)
      - "traefik.http.routers.hermes-dashboard-public.rule=Host(`${HERMES_PUBLIC_DOMAIN:-hermes-public.invalid}`)"
      - "traefik.http.routers.hermes-dashboard-public.entrypoints=websecure"
      - "traefik.http.routers.hermes-dashboard-public.tls=true"
      - "traefik.http.routers.hermes-dashboard-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermes-dashboard-public.service=hermes-dashboard-svc"
      # MCP Server routing (port 8765)
      - "traefik.http.routers.hermes-mcp.rule=Host(`mcp.spencer.lan`)"
      - "traefik.http.routers.hermes-mcp.entrypoints=websecure"
      - "traefik.http.routers.hermes-mcp.tls=true"
      - "traefik.http.routers.hermes-mcp.service=hermes-mcp-svc"
      - "traefik.http.services.hermes-mcp-svc.loadbalancer.server.port=8765"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    networks:
      - ai
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB}
    volumes:
      - ./nuq-postgres:/var/lib/postgresql/data
    networks:
      - ai

  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: playwright-service
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - ai

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    networks:
      - ai
      - redis
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
      REDIS_URL: redis://valkey:6379
      REDIS_RATE_LIMIT_URL: redis://valkey:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB}
      SEARXNG_ENDPOINT: http://searxng:8080
      USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      HARNESS_STARTUP_TIMEOUT_MS: 60000
    depends_on:
      valkey:
        condition: service_started
      searxng:
        condition: service_started
      playwright-service:
        condition: service_started
      nuq-postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

networks:
  net1:
    name: net1
    driver: bridge
  ai:
    name: ai
  db:
    name: db
  redis:
    name: redis

