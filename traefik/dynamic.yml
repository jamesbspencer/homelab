tls:
  certificates:
    - certFile: /etc/traefik/certs/cert.pem
      keyFile: /etc/traefik/certs/key.pem

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    crowdsec-bouncer:
      plugin:
        crowdsec-bouncer:
          enabled: true
          crowdsecMode: stream
          crowdsecLapiScheme: http
          crowdsecLapiHost: "crowdsec:8080"
          crowdsecLapiKeyFile: /etc/traefik/crowdsec_bouncer_key
          updateIntervalSeconds: 60
          defaultDecisionSeconds: 60
          clientTrustedIPs:
            - "127.0.0.1/32"
            - "192.168.0.0/16"
            - "10.0.0.0/8"

    geoblock:
      plugin:
        geoblock:
          api: "https://get.geojs.io/v1/ip/country/{ip}"
          allowLocalRequests: true
          xForwardedForReverseProxy: true
          addCountryHeader: true
          blackListMode: false
          countries:
            - US
          cacheSize: 1000
          logAllowedRequests: false
          logApiRequests: false








  routers:
    traefik-dashboard:
      rule: "Host(`traefik.spencer.lan`)"
      service: api@internal
      entryPoints:
        - websecure
      tls: {}
