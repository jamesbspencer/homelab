tls:
  certificates:
    - certFile: /etc/traefik/certs/cert.pem
      keyFile: /etc/traefik/certs/key.pem

http:
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  routers:
    traefik-dashboard:
      rule: "Host(`traefik.spencer.lan`)"
      service: api@internal
      entryPoints:
        - websecure
      tls: {}
