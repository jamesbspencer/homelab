global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: "INFO"

api:
  dashboard: true
  debug: true
  insecure: false

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "net1"
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true