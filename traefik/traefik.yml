global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: "INFO"

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json

api:
  dashboard: true
  debug: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        - "crowdsec-bouncer@file"
  
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "net1"
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.4.1"