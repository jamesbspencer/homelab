- AI & Agents:
    - Open WebUI:
        icon: open-webui.png
        href: https://chat.spencer.lan
        description: "Modern Generative AI Chat & Multi-Model Interface"
        server: local-docker
        container: open-webui
    - OmniRoute Gateway:
        icon: openai.png
        href: https://llm.spencer.lan
        description: "Universal AI Gateway & Dynamic LLM Router"
        server: local-docker
        container: omniroute
    - Ollama LLM:
        icon: ollama.png
        href: https://llm.spencer.lan
        description: "Local GPU-Accelerated LLM Runtime"
        server: local-docker
        container: ollama
        widget:
          type: customapi
          url: http://ollama:11434/api/tags
          mappings:
            - field: models.length
              label: Models
    - MoMoE Engine:
        icon: mdi-cpu-64-bit
        href: https://llm.spencer.lan
        description: "Hybrid MoE 64k Inference Engine (GPU + RAM)"
        server: local-docker
        container: momoe
    - NVIDIA RTX 3060:
        icon: nvidia.png
        href: https://glances.spencer.lan
        description: "12GB VRAM Local AI Hardware Accelerator"
        server: local-docker
        container: glances
        widget:
          type: glances
          url: http://glances:61208
          version: 4
          metric: gpu:nvidia0
          refreshInterval: 5000

