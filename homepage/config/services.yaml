        container: litellm
    - Hindsight Memory:
        icon: mdi-brain
        href: https://hindsight.spencer.lan
        description: "Persistent Vector Memory Engine"
        server: local-docker
        container: hindsight
    - Ollama LLM:
        icon: ollama.png
        href: https://llm.spencer.lan
        description: "Local GPU-Accelerated LLM Runtime"
