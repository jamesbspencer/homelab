- Developer Tools & Ops:
    - Gitea:
        icon: gitea.png
        href: https://git.spencer.lan
        description: "Self-Hosted Git Platform & Repositories"
        server: local-docker
        container: gitea
    - Dozzle:
        icon: dozzle.png
        href: https://logs.spencer.lan
        description: "Real-Time Container Log Streamer"
        server: local-docker
        container: dozzle
    - ntfy Alerts:
        icon: ntfy.png
        href: https://push.spencer.lan
        description: "System Notifications & Push Gateway"
        server: local-docker
        container: ntfy
    - Host Performance:
        icon: glances.png
        href: https://glances.spencer.lan
        description: "Physical Host CPU, System Load & Processes"
